name: Test rozliczen Excel
on:
  push:
    branches: [main, fix/xlsx-compatibility-empik]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj wymagania
        run: python -m pip install -r requirements.txt pytest
      - name: Sprawdz rozliczenia i zgodnosc Excel
        run: python -m pytest -q tests/test_excel_compatibility.py tests/test_settlements.py tests/test_export_22.py tests/test_storage_limits.py tests/test_photo_separator.py tests/test_empik_photo_headers.py
